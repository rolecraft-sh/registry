name: Validate Skill Submission
on:
  pull_request_target:
    paths:
      - 'index.json'
  push:
    branches:
      - main
    paths:
      - 'index.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Security: with pull_request_target, untrusted PR code must never run.
      # We check out the TRUSTED base branch (deps: package.json, scripts/,
      # node_modules all come from base) and read only index.json from the
      # PR/push commit via git show.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load skill index from PR/push commit
        run: |
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "refs/pull/${PR_NUMBER}/head:pr_head"
            echo "HEAD_SHA=pr_head" >> "$GITHUB_ENV"
          fi
          git show "${HEAD_SHA}:index.json" > index.json

      - name: Validate JSON syntax
        run: node -e "JSON.parse(require('fs').readFileSync('index.json','utf-8'))"

      - name: Validate against schema
        run: |
          npm install
          node scripts/validate.js schema.json index.json

      - name: Check for duplicate slugs
        run: node scripts/check-duplicates.js

      - name: Detect changed slugs
        id: changes
        run: |
          CHANGED=$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- index.json \
            | grep '^[+]' | grep -oP '"slug":\s*"\K[^"]+' \
            | sort -u | paste -sd, -)
          echo "CHANGED_SLUGS=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Verify publisher identity
        if: github.event_name == 'pull_request_target'
        env:
          GH_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CHANGED_SLUGS: ${{ steps.changes.outputs.CHANGED_SLUGS }}
        run: node scripts/verify-owner.js

      - name: Verify source repo exists
        if: steps.changes.outputs.CHANGED_SLUGS != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGED_SLUGS: ${{ steps.changes.outputs.CHANGED_SLUGS }}
        run: node scripts/verify-repo.js

      # Validate each changed skill can be resolved & installed by rolecraft.
      # This catches malformed SKILL.md, broken frontmatter, or missing sources
      # before they enter the registry.
      - name: Validate skills with rolecraft
        if: steps.changes.outputs.CHANGED_SLUGS != ''
        env:
          CHANGED_SLUGS: ${{ steps.changes.outputs.CHANGED_SLUGS }}
        run: |
          npm install -g rolecraft@latest
          IFS=',' read -ra SLUGS <<< "$CHANGED_SLUGS"
          for slug in "${SLUGS[@]}"; do
            slug=$(echo "$slug" | xargs) # trim whitespace
            repo=$(node -e "const d=JSON.parse(require('fs').readFileSync('index.json','utf-8')); const s=d.skills.find(x=>x.slug==='$slug'); process.stdout.write(s? s.repo : '')")
            if [ -z "$repo" ]; then
              echo "❌ Slug '$slug' not found in index.json"
              exit 1
            fi
            echo "🔍 Validating: $slug (source: $repo) ..."
            rolecraft install "$repo" --skill "$slug" --dry-run --yes
            echo "✅ $slug passed rolecraft validation"
          done

      - name: Auto-merge validated skill
        if: success() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED="${{ steps.changes.outputs.CHANGED_SLUGS }}"
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" \
            --subject "publish: ${CHANGED}"
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --body "✅ All checks passed. Skill \`${CHANGED}\` has been auto-merged."
